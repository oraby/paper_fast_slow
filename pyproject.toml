[project]
name = "paper-fast-slow"
version = "0.0.0"
description = "RL / DDM fast-slow model. This pyproject only pins the Python dependency environment (managed by uv). The source is imported as paper_fast_slow.code.rlmodel.* and is NOT installed as a package."
# Parity with the existing conda env (CPython 3.14), kept as a range so uv can
# fall back to 3.13/3.12 if a wheel is missing for a dependency on 3.14.
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas<3.0.0",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "statsmodels",
    "ipykernel",
    "scikit-posthocs",
    # pipeline.traceswidth imports skimage.transform at module scope, so
    # anything importing common.imaging needs it available.
    "scikit-image",
    # opto.optoreactiontime imports sklearn.linear_model at module scope.
    "scikit-learn",
    "ipympl",
    "pytest",
    # behavior.stdispersion imports seaborn at module scope (so far it only
    # came in transitively through scikit-posthocs).
    "seaborn",

    # --- previously undeclared, found by auditing every import in code/ and
    # --- the notebooks against this list (see docs/repo-audit.md).
    # widefield.pipelineprocessors and Tracking.ipynb.
    "opencv-python",
    "tifffile",
    # twop.plot.statsregiondist imports venn2/venn3 at module scope (twop.plot
    # .rocplot guards it, that one does not), and 2pAnalysis.ipynb uses it.
    "matplotlib-venn",
    # data_downloader.ipynb fetches the 2-photon archive with it.
    "requests",
    # IPython.display.display is imported at module scope in ~17 modules, and
    # ipywidgets drives the interactive model GUI. Both arrived transitively
    # via ipykernel; naming them stops a transitive change breaking imports.
    "ipython",
    "ipywidgets",
    # PIL: rlmodel.model.mle_notebooks.ddm_viewer, widefield.pipelineprocessors.
    "pillow",
    # common.cache falls back silently when dill is absent; declaring it makes
    # the caching path deterministic rather than environment-dependent.
    "dill",
]

[tool.uv]
# Not a distributable package: uv only builds the dependency virtualenv, it
# does not try to install this project. The source tree is put on the import
# path by pytest itself (see [tool.pytest.ini_options] below).
package = false

[tool.pytest.ini_options]
# Run the suite with the `pytest` console script from THIS directory:
#     uv run pytest                 (optionally: uv run pytest -k <expr>)
# Using the console script (not `python -m pytest`) means cwd is not prepended
# to sys.path; pytest instead adds the repo's parent via the package __init__
# chain, so the local `code/` package never shadows the stdlib `code` module.
# That is why no parent-directory dance is needed any more.
testpaths = ["code/rlmodel/model/tests", "code/widefield/tests",
             "code/common/tests", "code/twop/tests", "code/behavior/tests",
             "code/figcode/tests", "code/opto/tests", "code/tracking/tests",
             "code/pipeline/tests", "code/util/tests"]
# code/figcode/psychofit/ is a git submodule (cortex-lab/psychofit) and carries
# its own unittest suite; it is upstream's to run, not this repo's.
